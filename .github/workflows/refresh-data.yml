name: Refresh dashboard data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch sheet and re-encrypt data
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
          PIN: ${{ secrets.PIN }}
        run: node scripts/refresh-data.js
      - name: Commit and redeploy if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/snapshot.enc.json; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.enc.json
          git commit -m "Обновление данных из таблицы"
          git push
          # коммит от GITHUB_TOKEN сам публикацию не запускает, запускаем вручную
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
